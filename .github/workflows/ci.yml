name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/alexeybasak/blog-django-docker

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Ruff (lint)
        run: ruff check .

      - name: Django system check
        run: python manage.py check
        env:
          SECRET_KEY: ci-only-key
          POSTGRES_DB: x
          POSTGRES_USER: x
          POSTGRES_PASSWORD: x

      - name: Django deploy check (informational)
        run: python manage.py check --deploy
        env:
          SECRET_KEY: ci-only-key-ci-only-key-ci-only-key-ci-only-key-123456
          DEBUG: "False"
          ALLOWED_HOSTS: example.com
          HTTPS_ENABLED: "True"
          POSTGRES_DB: x
          POSTGRES_USER: x
          POSTGRES_PASSWORD: x

      - name: Unit tests
        run: python manage.py test

  security:
    name: Security (SAST, deps, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install tools
        run: pip install bandit pip-audit

      - name: Bandit (SAST)
        run: bandit -r accounts blog main -x "*/tests.py" -ll

      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt

      - name: Gitleaks (secrets in files)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            detect --source /repo --no-git --no-banner --redact

  build-scan-push:
    name: Build, Trivy scan, Push to GHCR
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (quality gate - fail on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:0.69.3 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
