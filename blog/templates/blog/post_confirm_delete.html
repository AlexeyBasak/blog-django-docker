{% extends 'blog/base.html' %}

{% block title %}Удалить пост{% endblock %}

{% block content %}
    <h1>Удалить пост</h1>
    <p>Вы уверены, что хотите удалить пост "<strong>{{ post.title }}</strong>"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'blog:post_list' %}">Отмена</a>
    </form>
{% endblock %}
